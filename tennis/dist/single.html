<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퓨처스에서 그랜드슬램까지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 한 줄짜리 모바일 앱. 위에 코트색 앱바, 아래 고정 탭바, 가운데 카드 스택. */
:root {
  --bg: #f2f5f0; --surface: #ffffff; --surface-2: #e9eee7; --fg: #15231c; --muted: #5d6a62; --line: #d7ded8;
  --court: #1f5f8b; --court-deep: #164566; --court-ink: #ffffff; --ball: #d8e84a; --ball-ink: #2b3400;
  --good: #2e7d4f; --warn: #b4551f; --bad: #b3261e; --warn-bg: #fbeadb;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --font-display: 'Do Hyeon', 'Noto Sans KR', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 14px; --shadow: 0 1px 2px rgba(21, 35, 28, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e1812; --surface: #172420; --surface-2: #1f2f28; --fg: #e9f0ea; --muted: #a3b3a9; --line: #2b3b33; --court: #4d9bd8; --court-deep: #2c6ea3; --court-ink: #06131d; --ball: #e2f05a; --ball-ink: #1c2200; --good: #6fcf97; --warn: #f0a070; --bad: #ff7b72; --warn-bg: #3a2a1c; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0e1812; --surface: #172420; --surface-2: #1f2f28; --fg: #e9f0ea; --muted: #a3b3a9; --line: #2b3b33; --court: #4d9bd8; --court-deep: #2c6ea3; --court-ink: #06131d; --ball: #e2f05a; --ball-ink: #1c2200; --good: #6fcf97; --warn: #f0a070; --bad: #ff7b72; --warn-bg: #3a2a1c; --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--court); }
#app { min-height: 100%; display: flex; flex-direction: column; }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--court); color: var(--court-ink); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.appbar-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 20px; letter-spacing: .01em; }
.main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 92px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.hero { background: linear-gradient(135deg, var(--court-deep), var(--court)); color: var(--court-ink); border: 0; }
.hero p { margin: 8px 0 0; opacity: .92; max-width: 60ch; }
.hero-title { font-family: var(--font-display); font-size: 34px; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.hero .eyebrow { color: var(--ball); }
.h2 { font-family: var(--font-display); font-size: 24px; margin: 0 0 8px; line-height: 1.2; text-wrap: balance; }
.h2 small { font-family: var(--font-body); font-size: 13px; font-weight: 400; }
.h3 { font-size: 15px; margin: 16px 0 8px; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.up { color: var(--good); } .down { color: var(--bad); }
.notice { border-radius: 10px; padding: 10px 12px; margin: 0; }
.notice.warn { background: var(--warn-bg); color: var(--fg); }
.chip-row { display: flex; gap: 6px; align-items: center; }
.chip-row.wrap { flex-wrap: wrap; margin-top: 8px; }
.chip { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.appbar .chip { background: rgba(255,255,255,.16); color: var(--court-ink); }
.chip-strong { background: var(--ball); color: var(--ball-ink); font-weight: 700; }
.chip-warn { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
/* 선수 카드 */
.player-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.player-name { font-family: var(--font-display); font-size: 28px; margin: 0; line-height: 1.1; }
.player-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.ovr { text-align: center; background: var(--court); color: var(--court-ink); border-radius: 12px; padding: 6px 14px; min-width: 72px; }
.ovr-num { font-family: var(--font-num); font-size: 30px; font-weight: 500; line-height: 1; }
.ovr-label { font-size: 11px; opacity: .85; margin-top: 2px; }
.player-body { display: grid; grid-template-columns: 240px 1fr; gap: 14px; align-items: center; margin-top: 12px; }
@media (max-width: 560px) { .player-body { grid-template-columns: 1fr; justify-items: center; } }
.radar { width: 240px; max-width: 100%; height: auto; }
.radar-ring { fill: none; stroke: var(--line); stroke-width: 1; }
.radar-fill { fill: var(--ball); fill-opacity: .55; stroke: var(--court); stroke-width: 2; stroke-linejoin: round; }
.radar-label { font-size: 10px; fill: var(--muted); font-family: var(--font-body); }
.radar-val { fill: var(--fg); font-family: var(--font-num); font-weight: 500; }
.bars { display: grid; gap: 6px; width: 100%; min-width: 0; }
.bar-row { display: grid; grid-template-columns: 52px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; }
.bar-name { color: var(--muted); }
.bar-track { display: block; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--court); border-radius: 999px; }
.bar-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.bar-num small { margin-left: 4px; font-size: 11px; }
/* 버튼 */
.btn { font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px 14px; cursor: pointer; transition: transform .06s ease; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }
.btn.primary { background: var(--court); border-color: var(--court); color: var(--court-ink); }
.btn.primary:hover { background: var(--court-deep); }
.btn.big { width: 100%; padding: 14px; font-size: 17px; margin-top: 14px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.inline-confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; padding: 10px; border-radius: 10px; background: var(--warn-bg); }
/* 플랜 */
.plans { display: grid; gap: 8px; margin-top: 8px; }
.plan { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.plan:has(input:checked) { border-color: var(--court); box-shadow: inset 0 0 0 1px var(--court); }
.plan input { margin-top: 4px; accent-color: var(--court); }
.plan-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.diff { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.diff-0 { background: var(--surface-2); color: var(--muted); } .diff-1 { background: #dcefe3; color: #1d5a37; } .diff-2 { background: #e3eefa; color: #1d4e7a; } .diff-3 { background: var(--warn-bg); color: var(--warn); } .diff-4 { background: #f8dcda; color: var(--bad); }
:root[data-theme="dark"] .diff-1, :root[data-theme="dark"] .diff-2, :root[data-theme="dark"] .diff-4 { background: var(--surface-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .diff-1, :root:not([data-theme="light"]) .diff-2, :root:not([data-theme="light"]) .diff-4 { background: var(--surface-2); } }
/* 결과 */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
@media (max-width: 420px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.stat-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.stat-num small { font-size: 11px; font-family: var(--font-body); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.award { background: var(--ball); color: var(--ball-ink); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.notes { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.notes li { margin: 3px 0; }
.entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.entry-head { width: 100%; display: grid; grid-template-columns: 50px 1fr auto 44px; gap: 8px; align-items: center; text-align: left; font: inherit; background: var(--surface-2); border: 0; border-radius: 10px; padding: 8px 10px; color: var(--fg); cursor: pointer; }
.entry-head:focus-visible { outline: 3px solid var(--ball); }
.entry-tier { font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.entry-name { min-width: 0; overflow-wrap: anywhere; }
.entry-pts { font-family: var(--font-num); font-size: 12px; text-align: right; color: var(--good); }
.res { font-size: 12px; white-space: nowrap; }
.res-win { color: var(--ball-ink); background: var(--ball); border-radius: 999px; padding: 1px 8px; font-weight: 700; }
.res-skip { color: var(--muted); }
.matches { list-style: none; margin: 4px 0 8px; padding: 0 10px; font-size: 13px; }
.matches li { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.matches li.won span:nth-child(2) { color: var(--good); } .matches li.lost span:nth-child(2) { color: var(--muted); }
.score { font-family: var(--font-num); font-size: 12px; white-space: nowrap; }
details.world { margin-top: 10px; font-size: 14px; }
details summary { cursor: pointer; font-weight: 700; }
/* 이벤트·제안 */
.event { border-left: 5px solid var(--ball); }
.options { display: grid; gap: 8px; margin-top: 10px; }
.option { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; }
.option small { font-weight: 400; color: var(--muted); font-size: 12px; }
.offers { display: grid; gap: 10px; margin-top: 8px; }
.offer { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.offer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
/* 은퇴 */
.story { padding-left: 20px; margin: 4px 0; }
.story li { margin: 4px 0; }
.alltime { display: grid; gap: 8px; }
.alltime-row { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 8px; align-items: center; font-size: 13px; }
@media (max-width: 420px) { .alltime-row { grid-template-columns: 1fr; gap: 2px; } }
/* 기록 */
.table-wrap { overflow-x: auto; }
.table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.table th { color: var(--muted); font-weight: 500; }
.plain { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 4px; font-size: 14px; }
.hof { padding-left: 22px; margin: 6px 0; display: grid; gap: 8px; }
.hof-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
/* 상점 */
.shop { display: grid; gap: 8px; margin-top: 8px; }
.shop-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; flex-wrap: wrap; }
.shop-buy { display: flex; align-items: center; gap: 10px; }
.price { font-family: var(--font-num); font-size: 13px; }
/* 생성 폼 */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-weight: 700; font-size: 14px; }
.field input[type=text], .field select, .textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); width: 100%; }
.textarea { min-height: 110px; font-family: var(--font-num); font-size: 12px; margin-top: 8px; }
.seg { display: flex; gap: 6px; }
.seg.wrap { flex-wrap: wrap; }
.seg-item { position: relative; }
.seg-item input { position: absolute; opacity: 0; inset: 0; }
.seg-item span { display: inline-block; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.seg-item input:checked + span { background: var(--court); color: var(--court-ink); border-color: var(--court); }
.seg-item input:focus-visible + span { outline: 3px solid var(--ball); }
.choice-grid { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--court); box-shadow: inset 0 0 0 1px var(--court); }
.choice input { margin-top: 4px; accent-color: var(--court); }
.cands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
@media (max-width: 640px) { .cands { grid-template-columns: 1fr; } }
.cand { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; justify-items: center; }
.cand-head { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.cand .bars { width: 100%; }
.cand .btn { width: 100%; }
/* 탭바 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { flex: 1; font: inherit; font-weight: 700; font-size: 13px; padding: 12px 4px; background: none; border: 0; color: var(--muted); cursor: pointer; border-top: 3px solid transparent; }
.tab.active { color: var(--court); border-top-color: var(--court); }
.tab:focus-visible { outline: 3px solid var(--ball); outline-offset: -3px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>

<div id="app"><main class="main"><section class="card"><p class="muted">게임을 불러오는 중입니다. 이 문구가 계속 보이면 브라우저가 ES 모듈을 지원하지 않거나 파일을 file:// 로 열었을 수 있습니다. 로컬 서버로 열어 주세요.</p></section></main></div>
<script type="module">
// 퓨처스에서 그랜드슬램까지 — 테니스 커리어 시뮬레이션 엔진
// 브라우저(<script type="module">)와 Node 양쪽에서 동작하는 순수 ES 모듈입니다.
// 모든 규칙은 docs/kickru-analysis.md 의 관찰을 테니스에 맞게 새로 설계한 것입니다.

const ENGINE_VERSION = 1;

// ───────────────────────── 기본 데이터 ─────────────────────────

  counter: { label: '카운터펀처', desc: '끈질긴 수비와 역습으로 상대를 지치게 하는 유형', w: { serve: .10, forehand: .18, backhand: .20, net: .06, movement: .26, mental: .20 } },

const SURFACES = {

  { id: 'CA', name: '캐나다', region: 'americas', strength: 78, names: 'en' },
  { id: 'AR', name: '아르헨티나', region: 'americas', strength: 76, names: 'es' },
  { id: 'BR', name: '브라질', region: 'americas', strength: 68, names: 'pt' },

  { id: 'ES', name: '스페인', region: 'europe', strength: 86, names: 'es' },
  { id: 'FR', name: '프랑스', region: 'europe', strength: 82, names: 'fr' },
  { id: 'IT', name: '이탈리아', region: 'europe', strength: 85, names: 'it' },

  { id: 'RS', name: '세르비아', region: 'europe', strength: 78, names: 'sl' },
  { id: 'RU', name: '러시아', region: 'europe', strength: 82, names: 'ru' },
  { id: 'CH', name: '스위스', region: 'europe', strength: 70, names: 'de' },
  { id: 'CZ', name: '체코', region: 'europe', strength: 76, names: 'sl' },
  { id: 'PL', name: '폴란드', region: 'europe', strength: 72, names: 'sl' },
  { id: 'GR', name: '그리스', region: 'europe', strength: 66, names: 'gr' },
  { id: 'NO', name: '노르웨이', region: 'europe', strength: 66, names: 'de' },
  { id: 'DK', name: '덴마크', region: 'europe', strength: 66, names: 'de' },
  { id: 'NL', name: '네덜란드', region: 'europe', strength: 70, names: 'de' },
  { id: 'AU', name: '호주', region: 'oceania', strength: 80, names: 'en' },
  { id: 'ZA', name: '남아공', region: 'africa', strength: 56, names: 'en' },
  { id: 'TN', name: '튀니지', region: 'africa', strength: 52, names: 'ar' },

// ───────────────────────── 난수 ─────────────────────────
function rand(state) {
  let s = (state.rng.s + 0x6D2B79F5) >>> 0;
  state.rng.s = s;
  let t = s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rint = (st, a, b) => a + Math.floor(rand(st) * (b - a + 1));
const pick = (st, arr) => arr[Math.floor(rand(st) * arr.length)];
function gauss(st) { let u = 0, v = 0; while (u === 0) u = rand(st); while (v === 0) v = rand(st); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const round1 = x => Math.round(x * 10) / 10;

function overallExact(p) { const w = STYLES[p.style].w; return ATTRS.reduce((s, a) => s + w[a] * p.attributes[a], 0); }
function overall(p) { return Math.round(overallExact(p)); }
function surfaceEff(p, surface) {
  const w = SURFACES[surface].w;
  const sv = ATTRS.reduce((s, a) => s + w[a] * p.attributes[a], 0);
  return .88 * overallExact(p) + .12 * sv;
}
function potentialGrade(pot) { return POTENTIAL_GRADES.find(g => pot <= g.max)?.grade ?? '세대급'; }

function genName(st, countryId, gender) {
  const pool = NAME_POOLS[COUNTRY_MAP[countryId]?.names ?? 'en'];
  const first = pick(st, gender === 'f' ? pool.f : pool.m), last = pick(st, pool.last);
  return pool.order === 'first' ? `${first} ${last}` : `${last}${pool.join}${first}`;
}

function sampleCountry(st, exclude) {
  const total = COUNTRIES.reduce((s, c) => s + c.strength ** 2, 0);
  let r = rand(st) * total;
  for (const c of COUNTRIES) { r -= c.strength ** 2; if (r <= 0) return c.id; }
  return COUNTRIES[0].id;
}

const NPC_COUNT = 400;
const rankToOvr = rank => 91 - 9.5 * Math.log10(Math.max(1, rank));

function makeNpc(st, gender, rank, age) {
  const nat = sampleCountry(st);
  const ovr = rankToOvr(rank) + gauss(st) * 1.1;
  const pot = Math.max(ovr, ovr + Math.max(0, 25 - age) * (0.6 + 1.4 * rand(st)));
  return { id: `n${st.rng.s.toString(36)}${rank}`, name: genName(st, nat, gender), nat, age, ovr: clamp(ovr, 40, 95), pot: clamp(pot, ovr, 97), pts: 0, titles: 0, gs: 0, no1: 0, curve: pick(st, CURVES) };
}
function makeWorld(st, gender, year) {
  const npcs = [];
  for (let r = 1; r <= NPC_COUNT; r++) npcs.push(makeNpc(st, gender, r, rint(st, 18, 33)));
  const world = { year, npcs, gsWinners: [], no1History: [] };
  seasonPointsNpc(st, world);
  rankNpcs(world);
  return world;
}
function npcSeasonPts(st, ovr) {
  // 실제 투어 포인트 규모에 맞춘 곡선: 72→400, 80→1,560, 88→6,100, 92→8,500, 96→10,900
  const base = ovr <= 88 ? 400 * Math.exp(.17 * (ovr - 72)) : 6100 + (ovr - 88) * 600;
  const noise = ovr >= 86 ? .12 : .28;
  return base * Math.exp(gauss(st) * noise);
}
// 시즌 포인트 → 세계 랭킹. NPC 풀(400명) 아래는 포인트 곡선으로 외삽한다.
function rankFromPts(world, pts) {
  if (!pts || pts <= 0) return null;
  const above = world.npcs.filter(n => n.pts > pts).length;
  if (above < world.npcs.length) return 1 + above;
  const floorPts = Math.max(1, world.npcs[world.npcs.length - 1].pts);
  return Math.min(2500, Math.max(world.npcs.length + 1, Math.round(world.npcs.length * Math.pow(floorPts / pts, .7))));
}
function seasonPointsNpc(st, world) { for (const n of world.npcs) n.pts = Math.round(npcSeasonPts(st, n.ovr)); }
function rankNpcs(world) { world.npcs.sort((a, b) => b.pts - a.pts || b.ovr - a.ovr); world.npcs.forEach((n, i) => n.rank = i + 1); }
function evolveNpcs(st, world, gender, playerOvr = 0) {
  // 선수가 월드를 압도하면 젊은 상위권 NPC의 잠재력이 따라 올라온다(라이벌 세대)
  if (playerOvr > world.npcs[0].ovr - 1) for (const n of world.npcs.slice(0, 20).filter(n => n.age <= 28).slice(0, 3)) n.pot = Math.max(n.pot, playerOvr - 1 + 3 * rand(st) + (playerOvr > 94 ? 1 : 0));
  for (const n of world.npcs) {
    n.age += 1;
    if (n.age < 25 || (n.age < 29 && n.pot >= 88)) n.ovr += Math.min(n.pot - n.ovr, (n.pot >= 88 ? 2.4 : 1.2) + 2.2 * rand(st)) * (n.curve === 'early' ? 1.2 : n.curve === 'late' ? .7 : 1);
    else if (n.age < 30) n.ovr += (rand(st) - .5) * 1.2 + (n.curve === 'late' && n.age < 28 ? .8 : 0);
    else n.ovr -= (0.8 + 1.6 * rand(st)) * (1 + (n.age - 30) * .18);
  }
  // 은퇴와 신인 보충
  world.npcs = world.npcs.filter(n => !(n.age >= 36 || (n.age >= 32 && n.ovr < 66) || (n.age >= 34 && rand(st) < .35)));
  while (world.npcs.length < NPC_COUNT) {
    const young = makeNpc(st, gender, rint(st, 180, 900), rint(st, 17, 19));
    young.ovr = 56 + rand(st) * 14; young.pot = young.ovr + 8 + rand(st) * 22 + (rand(st) < .06 ? 10 : 0);
    if (rand(st) < .03) young.pot = 90 + rand(st) * 7;
    world.npcs.push(young);
  }
  // 세대교체로 풀의 분포가 기준 곡선에서 떠내려가지 않도록, 순위별 기준값 쪽으로 절반쯤 되돌린다(개인차는 유지).
  world.npcs.sort((a, b) => b.ovr - a.ovr);
  world.npcs.forEach((n, i) => { if (i < 8) return; const target = rankToOvr(i + 1); const adj = (n.ovr - target) * .4; n.ovr -= adj; n.pot -= adj; });
  seasonPointsNpc(st, world); rankNpcs(world);
}
function opponentFor(st, state, tier, roundsFromEnd, qualifying) {
  const win = (OPP_WINDOWS[tier] ?? OPP_WINDOWS.t250);
  let [lo, hi] = win[Math.min(roundsFromEnd, win.length - 1)];
  if (qualifying) { lo = Math.round(lo * 1.8 + 20); hi = Math.round(hi * 1.8 + 40); }
  const rank = rint(st, lo, hi);
  const npc = state.world.npcs[rank - 1];
  const p = state.player;
  if (npc) return { id: npc.id, name: npc.name, nat: npc.nat, rank: npc.rank, ovr: npc.ovr + gauss(st) * .6, age: npc.age };
  return { id: null, name: genName(st, sampleCountry(st), p.gender), nat: null, rank, ovr: rankToOvr(rank) + gauss(st) * 1.3, age: rint(st, 18, 31) };
}
function juniorOpponent(st, state, roundsFromEnd) {
  const base = 38 + (state.player.age - 15) * 2.5;

function makeCandidates({ seed, style, gender }) {
  const st = { rng: { s: (seed ?? Date.now()) >>> 0 } };
  const variants = [
    { id: 'attack', label: '공격형', bias: { serve: 3, forehand: 3, backhand: 0, net: 1, movement: -4, mental: -3 } },
    { id: 'defense', label: '수비형', bias: { serve: -3, forehand: -2, backhand: 1, net: -3, movement: 4, mental: 3 } },
    { id: 'balanced', label: '균형형', bias: { serve: 0, forehand: 0, backhand: 0, net: 0, movement: 0, mental: 0 } },
  ];
  return variants.map(v => {
    const w = STYLES[style].w;
    const attrs = {};
    for (const a of ATTRS) attrs[a] = 42 + 60 * (w[a] - 1 / 6) + v.bias[a] + gauss(st) * 2.2;
    normalizeAttrs(attrs, style, 45);
    const g = rand(st);
    let acc = 0, pot = 65;
    for (const grade of POTENTIAL_GRADES) { acc += grade.p; if (g < acc) { pot = rint(st, grade.min, grade.max); break; } }
    if (g >= acc) pot = 99;
    const c = rand(st);
    let ci = CURVE_BOUNDS.findIndex(b => c < b); if (ci < 0) ci = CURVES.length - 1;
    const hidden = { potential: pot, curve: CURVES[ci], durability: round1(.65 + .9 * rand(st)), speed: pot >= 99 ? 1.35 + .2 * rand(st) : .75 + .5 * rand(st), agingSeed: rand(st), bloomAge: null, breakoutAge: null, lifts: 0 };
    return { id: v.id, label: v.label, attributes: Object.fromEntries(ATTRS.map(a => [a, Math.round(attrs[a])])), hidden, seedState: st.rng.s };
  });
}
function normalizeAttrs(attrs, style, targetOvr) {
  const w = STYLES[style].w;
  for (let i = 0; i < 3; i++) {
    const ovr = ATTRS.reduce((s, a) => s + w[a] * attrs[a], 0);
    for (const a of ATTRS) attrs[a] = clamp(attrs[a] + (targetOvr - ovr), 28, 62);
  }
}

  for (let i = 0; i < avail.length && out.length < n; i += step) out.push(avail[i]);

function awards(state, season) {
  const p = state.player;
  if (!p.pro) return;
  const give = (name) => { season.awards.push(name); p.awards.push({ year: state.year, name }); };
  if (p.rank === 1) { give('올해의 선수'); give('연말 세계 1위'); p.story.push({ year: state.year, text: '연말 세계 1위' }); }
  const prevRank = season.prevRank ?? 9999;
  if (p.age <= 21 && p.rank <= 100 && prevRank > 100) give('올해의 신인');
  if (prevRank > 150 && p.rank <= 50) give('올해의 컴백');
  if (season.titles.filter(t => ['gs', 'm1000', 't500', 't250', 'finals'].includes(t.tier)).length >= 5) give('올해의 최다 우승');
  const gsCount = season.titles.filter(t => t.tier === 'gs').length;
  if (gsCount === 4) { give('캘린더 그랜드슬램'); p.story.push({ year: state.year, text: '한 해 4개 그랜드슬램 석권' }); }
  if (gsCount >= 1 && !p.story.some(s => s.text === '첫 그랜드슬램 우승')) p.story.push({ year: state.year, text: '첫 그랜드슬램 우승' });
  if (season.titles.length && !p.story.some(s => s.text === '첫 투어 우승') && season.titles.some(t => ['t250', 't500', 'm1000', 'gs'].includes(t.tier))) p.story.push({ year: state.year, text: '첫 투어 우승' });
  if (p.rank <= 100 && prevRank > 100) p.story.push({ year: state.year, text: '첫 톱100 진입' });
  if (p.rank <= 10 && prevRank > 10) p.story.push({ year: state.year, text: '첫 톱10 진입' });
  // 시즌 기록
  const recs = [['titles', season.titles.length, '한 시즌 최다 우승', '회'], ['wins', season.wins, '한 시즌 최다 승', '승'], ['pts', season.pts, '한 시즌 최다 포인트', '점']];

    const cur = p.records.find(r => r.key === key);

function worldSeasonRecord(state, season) {
  const w = state.world, p = state.player;

  const winners = [];
  for (const gs of CALENDAR.gs) {
    if (myGs.has(gs.name)) { winners.push({ year: state.year, name: gs.name, winner: p.name, me: true }); continue; }
    const top = w.npcs.slice(0, 10);
    const weights = top.map((n, i) => Math.exp(-i * .45));
    let r = rand(state) * weights.reduce((a, b) => a + b, 0), idx = 0;
    for (; idx < top.length; idx++) { r -= weights[idx]; if (r <= 0) break; }
    const n = top[Math.min(idx, top.length - 1)]; n.gs++; n.titles++;

  }
  w.gsWinners.push(...winners);
  season.gsWinners = winners;
  if (p.rank === 1) w.no1History.push({ year: state.year, name: p.name, me: true });
  else { const n = w.npcs[0]; n.no1++; w.no1History.push({ year: state.year, name: n.name, me: false }); }
}

function restock(state) {
  const p = state.player;
  const avail = SHOP_ITEMS.filter(i => !p.shop.owned.includes(i.id));
  const affordable = avail.filter(i => i.price <= Math.max(5000, p.balance * 3));
  const pool = affordable.length >= 3 ? affordable : avail;
  const out = [];
  const copy = [...pool];
  while (out.length < 3 && copy.length) out.push(copy.splice(Math.floor(rand(state) * copy.length), 1)[0].id);
  return out;
}

    <nav class="tabbar" aria-label="메뉴">${[['home', '홈'], ['records', '기록'], ['shop', '상점'], ['hof', '전당'], ['settings', '설정']].map(([id, l]) => `<button class="tab ${tab === id ? 'active' : ''}" data-tab="${id}">${l}</button>`).join('')}</nav>`;
  }

  function playerCard() {
    const p = S.player, ovr = ovrOf(p);
    const grade = p.age >= 19 && p.pro ? `<span class="chip">스카우트 평가 · ${E.potentialGrade(p.hidden.potential)}</span>` : `<span class="chip">잠재력 미공개</span>`;
    const moraleTxt = p.morale >= 3 ? '최고' : p.morale >= 1 ? '좋음' : p.morale > -1 ? '보통' : p.morale > -3 ? '나쁨' : '바닥';
    return `<section class="card player">
      <div class="player-head"><div><h1 class="player-name">${esc(p.name)}</h1><div class="player-sub">${E.COUNTRY_MAP[p.nationality].name} · ${styleLabel(p.style)} · ${p.gender === 'm' ? '남자 투어' : '여자 투어'}</div></div><div class="ovr"><div class="ovr-num">${ovr}</div><div class="ovr-label">오버롤</div></div></div>
      <div class="chip-row wrap">${grade}<span class="chip">사기 ${moraleTxt}</span><span class="chip">명성 ${Math.round(p.fame)}</span><span class="chip">잔고 ${money(p.balance)}</span>${p.coach ? `<span class="chip">코치 · ${esc(p.coach.name)}</span>` : ''}${p.sponsor ? `<span class="chip">후원 · ${esc(p.sponsor.brand)}</span>` : ''}${p.military === 'serving' ? '<span class="chip chip-warn">군 복무 중</span>' : p.military === 'exempt' ? '<span class="chip">병역 혜택</span>' : ''}${p.injuries.some(i => i.remaining > 0) ? `<span class="chip chip-warn">${esc(p.injuries[0].name)} · ${p.injuries[0].remaining}주</span>` : ''}</div>
      <div class="player-body">${radar(p.attributes)}${bars(p.attributes)}</div>
      <p class="muted small">집중 훈련: ${p.focus.map(a => E.ATTR_LABELS[a]).join(', ') || '없음'} · 최고 랭킹 ${p.peakRank ? p.peakRank + '위' : '없음'} · 통산 ${p.career.wins}승 ${p.career.losses}패 · 우승 ${p.career.titles}회${p.career.gs ? ` (그랜드슬램 ${p.career.gs})` : ''}</p>
    </section>`;
  }

  function homeTab() {
    const stage = S.stage;
    let panel = '';
    if (stage === 'ready') panel = readyPanel();
    else if (stage === 'result') panel = resultPanel();
    else if (stage === 'event') panel = eventPanel();
    else if (stage === 'offers') panel = offersPanel();
    else if (stage === 'advice') panel = advicePanel();
    else if (stage === 'retired') panel = retiredPanel();
    return playerCard() + panel;
  }

  function readyPanel() {
    const plans = E.availablePlans(S).map(id => E.planSummary(S, id));
    return `<section class="card"><h2 class="h2">시즌 일정 고르기</h2><p class="muted">${esc(S.message)}</p>
      <div class="plans">${plans.map(pl => `<label class="plan"><input type="radio" name="plan" value="${pl.id}" ${pl.id === plans[plans.length - 1].id ? 'checked' : ''}><div><div class="plan-head"><strong>${pl.label}</strong><span class="diff diff-${['쉬움 · 성장 제한', '적당함', '도전적', '버거움', '무리'].indexOf(pl.difficulty)}">${pl.difficulty}</span></div><div class="muted small">${pl.desc}</div><div class="small">대회 ${pl.events}개 · 본선 ${pl.main} · 예선 ${pl.qual}${pl.none ? ` · 자격 없음 ${pl.none}` : ''} · 평균 상대 ${pl.strength} · 경비 ${money(pl.travel)}</div></div></label>`).join('')}</div>
      <button class="btn primary big" data-act="play">시즌 진행</button>
      ${S.player.pro && S.player.age >= 24 ? (ui.confirmRetire ? `<div class="inline-confirm"><span>정말 은퇴할까요? 되돌릴 수 없습니다.</span><button class="btn danger" data-act="retire">은퇴한다</button><button class="btn" data-act="cancel-retire">취소</button></div>` : `<button class="btn ghost" data-act="ask-retire">은퇴하기</button>`) : ''}
    </section>`;
  }

  function entryRow(e) {
    const t = E.TIERS[e.tier];
    const result = e.skipped ? `<span class="res res-skip">${esc(e.skipped)}</span>` : e.title ? `<span class="res res-win">우승</span>` : `<span class="res">${esc(e.result ?? '')}</span>`;
    const open = ui.openEntry === e.name + e.week;
    const matches = e.matches?.length ? `<ul class="matches">${e.matches.map(m => `<li class="${m.won ? 'won' : 'lost'}"><span>${esc(m.round)}</span><span>${m.won ? '승' : '패'} vs ${esc(m.opp)}${m.oppRank ? ` (${m.oppRank}위)` : ''}</span><span class="score">${esc(m.score)}</span></li>`).join('')}</ul>` : '';
    return `<li class="entry ${open ? 'open' : ''}"><button class="entry-head" data-entry="${esc(e.name + e.week)}"><span class="entry-tier">${t?.short ?? ''}</span><span class="entry-name">${esc(e.name)}<small class="muted"> · ${E.SURFACES[e.surface]?.label ?? ''}${e.entry === 'qual' ? ' · 예선부터' : ''}</small></span>${result}<span class="entry-pts">${e.points ? `+${e.points}` : ''}</span></button>${open ? matches : ''}</li>`;
  }

  function resultPanel() {
    const h = S.lastSeason, p = S.player, g = h.growth;
    const rankTxt = h.plan === 'junior' ? `주니어 ${h.juniorRank}위` : `${fmtRank(h.rank)}${h.prevRank && h.rank ? ` <small class="${h.rank < h.prevRank ? 'up' : h.rank > h.prevRank ? 'down' : ''}">(${h.prevRank}위 → ${h.rank}위)</small>` : ''}`;
    return `<section class="card"><h2 class="h2">${h.year} 시즌 결과 <small class="muted">${h.age}세 · ${esc(h.planLabel)}</small></h2>
      <div class="stat-grid"><div class="stat"><div class="stat-num">${h.wins}승 ${h.losses}패</div><div class="stat-label">승패</div></div><div class="stat"><div class="stat-num">${h.pts.toLocaleString()}</div><div class="stat-label">시즌 포인트</div></div><div class="stat"><div class="stat-num">${rankTxt}</div><div class="stat-label">연말 랭킹</div></div><div class="stat"><div class="stat-num">${h.titles.length}</div><div class="stat-label">우승</div></div><div class="stat"><div class="stat-num">${money(h.prize)}</div><div class="stat-label">상금</div></div><div class="stat"><div class="stat-num">${g.before} → ${g.after}</div><div class="stat-label">오버롤</div></div></div>
      ${h.titles.length ? `<p><strong>우승:</strong> ${h.titles.map(t => esc(t.name)).join(', ')}</p>` : ''}
      ${h.awards.length ? `<p class="award">🏆 ${h.awards.map(esc).join(' · ')}</p>` : ''}
      ${h.national?.length ? `<p><strong>국가대항전:</strong> ${h.national.map(n => `${esc(n.name)} ${esc(n.result)}`).join(', ')}</p>` : ''}
      <h3 class="h3">성장</h3>${bars(g.attrs, h.startAttrs)}
      <ul class="notes">${[...g.notes, ...h.notes].map(n => `<li>${esc(n)}</li>`).join('')}${h.injuries.length ? `<li>부상: ${h.injuries.map(esc).join(', ')} (결장 ${h.missed}개 대회)</li>` : ''}<li class="muted">출전율 ${pct(g.participation)} · 활약도 ${pct(g.performance)}${g.decline ? ` · 노화 −${g.decline}` : ''}</li></ul>
      <h3 class="h3">대회별 결과</h3><ul class="entries">${h.entries.map(entryRow).join('')}</ul>
      ${h.gsWinners?.length ? `<details class="world"><summary>올해의 그랜드슬램 챔피언</summary><ul>${h.gsWinners.map(w => `<li>${esc(w.name)}: ${w.me ? '<strong>나</strong>' : esc(w.winner)}</li>`).join('')}</ul></details>` : ''}
      <p class="muted small">수입 ${money(h.prize + h.sponsor)} · 지출 경비 ${money(h.travel)} + 코치 ${money(h.coachFee)} · 잔고 ${money(p.balance)}</p>
      <button class="btn primary big" data-act="continue">계속</button></section>`;
  }

  function eventPanel() {
    const ev = S.event;
    return `<section class="card event"><div class="eyebrow">전환점</div><h2 class="h2">${esc(ev.title)}</h2><p>${esc(ev.text)}</p>
      <div class="options">${ev.options.map(o => `<button class="btn option" data-option="${esc(o.id)}"><span>${esc(o.label)}</span>${o.chance != null ? `<small>성공 ${pct(o.chance)} · 성공 시 ${effectText(o.success)} · 실패 시 ${effectText(o.fail)}</small>` : o.effect ? `<small>${effectText(o.effect)}</small>` : ''}</button>`).join('')}</div></section>`;
  }
  function effectText(e) {
    if (!e) return '';
    const parts = [];
    for (const a of E.ATTRS) if (e[a]) parts.push(`${E.ATTR_LABELS[a]} ${e[a] > 0 ? '+' : ''}${e[a]}`);
    if (e.laterServe) parts.push(`2년 뒤 서브 +${e.laterServe}`);
    if (e.morale) parts.push(`사기 ${e.morale > 0 ? '+' : ''}${e.morale}`);
    if (e.fame) parts.push(`명성 ${e.fame > 0 ? '+' : ''}${e.fame}`);
    if (e.money) parts.push(`${e.money > 0 ? '+' : '−'}${money(Math.abs(e.money))}`);
    if (e.durability) parts.push(`내구성 ${e.durability > 0 ? '상승' : '하락'}`);
    if (e.doubles) parts.push('복식 병행(부상 위험 ↑)');
    if (e.style) parts.push('스타일 전환');
    if (e.nationality) parts.push('국적 변경');
    if (e.rival) parts.push('라이벌 지정');
    if (e.focus) parts.push(`집중 훈련: ${e.focus.map(a => E.ATTR_LABELS[a]).join(', ')}`);
    if (e.newCoach) parts.push('새 코치 제안');
    if (e.mentalRisk) parts.push('멘탈 +1 또는 사기 −1');
    return parts.join(' · ') || '변화 없음';
  }

  function offersPanel() {
    return `<section class="card"><div class="eyebrow">비시즌 제안</div><h2 class="h2">계약 제안</h2>
      <div class="offers">${S.offers.map(o => o.kind === 'coach' ? `<div class="offer"><div class="offer-head"><strong>${esc(o.name)}</strong><span class="chip">${esc(o.label)}</span></div><p class="muted small">${esc(o.pitch)}</p><p class="small">훈련 효율 ×${o.mult.toFixed(2)} · 연 ${money(o.fee)} · ${o.years}년${o.rejected ? ` · <span class="down">${esc(o.rejected)}</span>` : ''}</p><button class="btn primary" data-offer="${esc(o.id)}">계약한다</button></div>` : `<div class="offer"><div class="offer-head"><strong>${esc(o.brand)}</strong><span class="chip">후원</span></div><p class="small">${esc(o.pitch)} · ${o.years}년</p><button class="btn primary" data-offer="${esc(o.id)}">계약한다</button></div>`).join('')}</div>
      <p class="muted small">현재: 코치 ${esc(S.player.coach.name)}(훈련 ×${S.player.coach.mult.toFixed(2)}, 연 ${money(S.player.coach.fee)})${S.player.sponsor ? ` · 후원 ${esc(S.player.sponsor.brand)} 연 ${money(S.player.sponsor.fee)} (${S.player.sponsor.years}년 남음)` : ' · 후원 없음'}</p>
      <button class="btn ghost" data-act="decline-offers">모두 거절하고 넘어가기</button></section>`;
  }

  function advicePanel() {
    const a = S.advice;
    return `<section class="card"><div class="eyebrow">${a.forced ? '은퇴' : '은퇴 권고'}</div><h2 class="h2">${a.forced ? '이제 라켓을 내려놓을 때입니다' : '다음 인생을 생각해 볼 때'}</h2><p>${esc(a.reason)}</p>
      <div class="row">${a.forced ? '' : '<button class="btn" data-act="advice-continue">한 시즌 더 뛴다</button>'}<button class="btn danger" data-act="advice-retire">은퇴한다</button></div></section>`;
  }

  function retiredPanel() {
    const s = S.summary, p = S.player;
    const hidden = `숨은 성장 곡선 ${s.hiddenCurve} · 잠재력 ${s.potential}(${s.potentialGrade}) · 노화 체질 ${({ fast: '이른 노화', normal: '보통', late: '늦은 노화', iron: '철인' })[s.aging]} · 내구성 ${p.hidden.durability.toFixed(2)}`;
    return `<section class="card"><div class="eyebrow">커리어 종료</div><h2 class="h2">${esc(p.name)}, ${esc(s.title)}</h2>
      <div class="chip-row wrap">${s.tags.map(t => `<span class="chip chip-strong">${esc(t)}</span>`).join('') || '<span class="chip">기록 없음</span>'}</div>
      <div class="stat-grid"><div class="stat"><div class="stat-num">${s.gs}</div><div class="stat-label">그랜드슬램</div></div><div class="stat"><div class="stat-num">${s.no1}</div><div class="stat-label">연말 1위</div></div><div class="stat"><div class="stat-num">${s.peakRank ?? '-'}</div><div class="stat-label">최고 랭킹</div></div><div class="stat"><div class="stat-num">${s.titles}</div><div class="stat-label">통산 우승</div></div><div class="stat"><div class="stat-num">${s.wins}승 ${s.losses}패</div><div class="stat-label">통산 전적</div></div><div class="stat"><div class="stat-num">${money(s.earnings)}</div><div class="stat-label">통산 수입</div></div></div>
      <h3 class="h3">인생 이야기</h3><ol class="story">${s.story.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
      <h3 class="h3">역대 기록과 비교</h3><div class="alltime">${s.allTime.map(r => `<div class="alltime-row"><span>${esc(r.label)}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.min(100, r.mine / r.record * 100)}%"></span></span><span class="bar-num">${r.mine.toLocaleString()} <small class="muted">/ ${esc(r.note)}</small></span></div>`).join('')}</div>
      <p class="muted small">공개된 숨은 특성: ${hidden}</p>
      <p class="muted small">이 커리어는 기기의 명예의 전당에 등록됐습니다.</p>
      <button class="btn primary big" data-act="new-career">새 커리어 시작</button></section>`;
  }

  function recordsTab() {
    const p = S.player, w = S.world;
    const rows = S.history.map(h => `<tr><td>${h.year}</td><td>${h.age}</td><td>${esc(h.planLabel)}</td><td>${h.wins}-${h.losses}</td><td>${h.pts}</td><td>${h.plan === 'junior' ? `J${h.juniorRank}` : (h.rank ?? '-')}</td><td>${h.titles.length}</td><td>${h.growth.after}</td></tr>`).join('');
    return `<section class="card"><h2 class="h2">시즌별 기록</h2><div class="table-wrap"><table class="table"><thead><tr><th>연도</th><th>나이</th><th>일정</th><th>승패</th><th>포인트</th><th>랭킹</th><th>우승</th><th>OVR</th></tr></thead><tbody>${rows || '<tr><td colspan="8" class="muted">아직 기록이 없습니다.</td></tr>'}</tbody></table></div></section>
    <section class="card"><h2 class="h2">우승과 수상</h2>${p.titles.length ? `<ul class="plain">${p.titles.slice().reverse().map(t => `<li>${t.year} · ${esc(t.name)} <span class="chip">${E.TIERS[t.tier]?.short ?? t.tier}</span></li>`).join('')}</ul>` : '<p class="muted">아직 우승이 없습니다.</p>'}${p.awards.length ? `<ul class="plain">${p.awards.slice().reverse().map(a => `<li>🏆 ${a.year} · ${esc(a.name)}</li>`).join('')}</ul>` : ''}${p.records.length ? `<ul class="plain">${p.records.map(r => `<li>${esc(r.label)} ${r.value}${esc(r.unit)} (${r.year})</li>`).join('')}</ul>` : ''}</section>
    <section class="card"><h2 class="h2">이 시대의 투어</h2><p class="small">연말 1위: ${w.no1History.slice(-6).map(n => `${n.year} ${n.me ? '<strong>나</strong>' : esc(n.name)}`).join(' · ') || '아직 없음'}</p><p class="small">현재 톱5: ${w.npcs.slice(0, 5).map(n => `${esc(n.name)}(${E.COUNTRY_MAP[n.nat]?.name ?? ''}, ${n.age}세)`).join(', ')}</p>${p.rival ? `<p class="small">라이벌: ${esc(p.rival.name)}</p>` : ''}<details><summary>최근 그랜드슬램 챔피언</summary><ul class="plain">${w.gsWinners.slice(-12).reverse().map(g => `<li>${g.year} ${esc(g.name)} · ${g.me ? '<strong>나</strong>' : esc(g.winner)}</li>`).join('')}</ul></details></section>`;
  }

  function shopTab() {
    const p = S.player;
    const item = id => E.SHOP_MAP[id];
    return `<section class="card"><h2 class="h2">상점</h2><p class="muted">잔고 ${money(p.balance)} · 시즌마다 새 상품 3개 · 한 시즌에 하나만 살 수 있습니다.${p.shop.bought ? ' 이번 시즌 구매를 마쳤습니다.' : ''}</p>
      <div class="shop">${p.shop.stock.map(id => { const it = item(id); const can = !p.shop.bought && p.balance >= it.price; return `<div class="shop-item"><div><strong>${esc(it.name)}</strong><div class="small muted">${it.aging ? `노화 속도 −${Math.round(it.aging * 100)}%` : `${E.ATTR_LABELS[it.stat]} +${it.value}`}</div></div><div class="shop-buy"><span class="price">${money(it.price)}</span><button class="btn ${can ? 'primary' : ''}" data-buy="${it.id}" ${can ? '' : 'disabled'}>${p.balance < it.price ? '자금 부족' : '구매'}</button></div></div>`; }).join('')}</div>
      ${p.shop.owned.length ? `<h3 class="h3">보유 아이템</h3><div class="chip-row wrap">${p.shop.owned.map(id => `<span class="chip">${esc(item(id)?.name ?? id)}</span>`).join('')}</div>` : ''}</section>`;
  }

  function hofTab() {
    const hof = store.get(HOF_KEY) ?? [];
    return `<section class="card"><h2 class="h2">명예의 전당</h2><p class="muted small">이 기기에서 은퇴한 선수들입니다. 그랜드슬램 → 연말 1위 → 최고 랭킹 → 통산 우승 순으로 비교합니다.</p>
      ${hof.length ? `<ol class="hof">${hof.map(h => `<li><div class="hof-head"><strong>${esc(h.name)}</strong><span class="muted small">${E.COUNTRY_MAP[h.nationality]?.name ?? ''} · ${styleLabel(h.style)} · ${esc(h.title)}</span></div><div class="small">GS ${h.gs} · 1위 ${h.no1}년 · 최고 ${h.peakRank >= 2500 ? '-' : h.peakRank + '위'} · 우승 ${h.titles} · ${h.wins}승 · ${h.retireAge}세 은퇴</div></li>`).join('')}</ol>` : '<p class="muted">아직 은퇴한 선수가 없습니다.</p>'}</section>`;
  }

  function settingsTab() {
    return `<section class="card"><h2 class="h2">설정</h2>
      <p class="muted small">진행 상황은 이 브라우저에 자동 저장됩니다. 기기를 바꾸거나 데이터를 지우면 사라지니 내보내기로 백업하세요.</p>
      <div class="row"><button class="btn" data-act="export">저장 파일 내보내기</button><button class="btn" data-act="copy-export" ${ui.exportOpen ? '' : 'hidden'}>복사</button></div>
      ${ui.exportOpen ? `<textarea id="export-area" class="textarea" readonly>${esc(JSON.stringify(S))}</textarea>` : ''}
      <h3 class="h3">저장 파일 가져오기</h3><textarea id="import-area" class="textarea" placeholder="내보낸 저장 파일 내용을 붙여넣으세요">${esc(ui.importText)}</textarea><div class="row"><button class="btn" data-act="import">가져오기</button>${ui.importMsg ? `<span class="small">${esc(ui.importMsg)}</span>` : ''}</div>
      <h3 class="h3">새 커리어</h3>${ui.confirmNew ? `<div class="inline-confirm"><span>지금 커리어는 사라집니다. 계속할까요?</span><button class="btn danger" data-act="new-career">새로 시작</button><button class="btn" data-act="cancel-new">취소</button></div>` : '<button class="btn ghost" data-act="ask-new">현재 커리어를 버리고 새로 시작</button>'}
      <p class="muted small">퓨처스에서 그랜드슬램까지 · 테니스 커리어 시뮬레이션. 모든 선수·코치·브랜드 이름은 가상입니다.</p></section>`;
  }

  // ── 선수 생성
  function createScreen() {
    const c = create;
    if (c.step === 'candidates') return candidatesScreen();
    const last = store.get(LAST_KEY);
    return `<header class="appbar"><div class="appbar-inner"><div class="brand">퓨처스에서 그랜드슬램까지</div></div></header><main class="main">
      <section class="card hero"><div class="eyebrow">테니스 커리어 시뮬레이션</div><h1 class="hero-title">15세, 첫 라켓을 잡는다</h1><p>주니어 대회에서 퓨처스, 챌린저, 투어를 거쳐 그랜드슬램과 연말 세계 1위까지. 능력치와 선택, 그리고 운이 커리어를 만듭니다.</p></section>
      <form class="card" id="create-form">
        ${c.error ? `<p class="notice warn">${esc(c.error)}</p>` : ''}
        <label class="field"><span>선수 이름 <small class="muted">실명 대신 닉네임을 권합니다</small></span><input id="f-name" type="text" maxlength="20" value="${esc(c.name)}" placeholder="예: 코트의 늑대"></label>
        <div class="field"><span>투어</span><div class="seg">${[['m', '남자 투어'], ['f', '여자 투어']].map(([v, l]) => `<label class="seg-item"><input type="radio" name="gender" value="${v}" ${c.gender === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
        <label class="field"><span>국적</span><select id="f-nat">${E.COUNTRIES.map(n => `<option value="${n.id}" ${c.nationality === n.id ? 'selected' : ''}>${n.name}</option>`).join('')}</select></label>
        <div class="field"><span>시작 경로</span><div class="choice-grid">${Object.entries(E.START_PATHS).map(([id, p]) => `<label class="choice"><input type="radio" name="path" value="${id}" ${c.path === id ? 'checked' : ''}><div><strong>${p.label}</strong><div class="small muted">${p.desc}</div><div class="small">훈련 효율 ×${p.coachMult} · 연 ${money(p.cost)}</div></div></label>`).join('')}</div></div>
        <div class="field"><span>플레이 스타일</span><div class="choice-grid">${Object.entries(E.STYLES).map(([id, s]) => `<label class="choice"><input type="radio" name="style" value="${id}" ${c.style === id ? 'checked' : ''}><div><strong>${s.label}</strong><div class="small muted">${s.desc}</div><div class="small">핵심: ${E.ATTRS.slice().sort((a, b) => s.w[b] - s.w[a]).slice(0, 2).map(a => E.ATTR_LABELS[a]).join(', ')}</div></div></label>`).join('')}</div></div>
        <div class="field"><span>집중 훈련 <small class="muted">최대 2개. 나중에 코치 제안으로만 바뀝니다.</small></span><div class="seg wrap">${E.ATTRS.map(a => `<label class="seg-item"><input type="checkbox" name="focus" value="${a}" ${c.focus.includes(a) ? 'checked' : ''}><span>${E.ATTR_LABELS[a]}</span></label>`).join('')}</div></div>
        <div class="row"><button class="btn primary big" type="submit">후보 선수 보기</button>${last ? '<button class="btn ghost" type="button" data-act="load-last">지난 설정 불러오기</button>' : ''}</div>
      </form>
      ${(store.get(HOF_KEY) ?? []).length ? `<section class="card"><h2 class="h2">명예의 전당</h2><ol class="hof">${(store.get(HOF_KEY) ?? []).slice(0, 5).map(h => `<li><strong>${esc(h.name)}</strong> <span class="muted small">${esc(h.title)} · GS ${h.gs} · 1위 ${h.no1}년</span></li>`).join('')}</ol></section>` : ''}
      </main>`;
  }
  function candidatesScreen() {
    const c = create;
    return `<header class="appbar"><div class="appbar-inner"><div class="brand">퓨처스에서 그랜드슬램까지</div></div></header><main class="main">
      <section class="card"><div class="eyebrow">후보 선수</div><h2 class="h2">${esc(c.name)} · ${styleLabel(c.style)}</h2><p class="muted">세 후보 모두 오버롤 45입니다. 차이는 능력치 분포뿐이고, 잠재력과 성장 곡선은 숨겨져 있습니다.</p>
      <div class="cands">${c.candidates.map((cd, i) => `<div class="cand"><div class="cand-head"><strong>${cd.label}</strong><span class="chip">OVR ${E.overall({ style: c.style, attributes: cd.attributes })}</span></div>${radar(cd.attributes, 160)}${bars(cd.attributes)}<button class="btn primary" data-cand="${i}">이 선수로 시작</button></div>`).join('')}</div>
      <div class="row"><button class="btn ghost" data-act="recand">다른 후보 보기</button><button class="btn ghost" data-act="back-form">설정으로 돌아가기</button></div></section></main>`;
  }

  // ── 이벤트 바인딩
  function bind() {
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; ui.exportOpen = false; render(); });
    root.querySelectorAll('[data-entry]').forEach(b => b.onclick = () => { ui.openEntry = ui.openEntry === b.dataset.entry ? null : b.dataset.entry; render(); });
    root.querySelectorAll('[data-option]').forEach(b => b.onclick = () => act({ type: 'resolveEvent', option: b.dataset.option }));
    root.querySelectorAll('[data-offer]').forEach(b => b.onclick = () => act({ type: 'acceptOffer', offer: b.dataset.offer }));
    root.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => act({ type: 'buy', item: b.dataset.buy }));
    root.querySelectorAll('[data-cand]').forEach(b => b.onclick = () => startCareer(Number(b.dataset.cand)));
    root.querySelectorAll('[data-act]').forEach(b => b.onclick = (ev) => { ev.preventDefault(); action(b.dataset.act); });
    const form = $('#create-form'); if (form) form.onsubmit = (ev) => { ev.preventDefault(); readForm(); if (!create.name.trim()) { create.error = '선수 이름을 입력하세요.'; render(); return; } if (!create.focus.length) { create.error = '집중 훈련 종목을 하나 이상 고르세요.'; render(); return; } create.error = ''; makeCands(); };
  }
  function readForm() {
    const c = create;
    c.name = $('#f-name')?.value ?? c.name; c.nationality = $('#f-nat')?.value ?? c.nationality;
    c.gender = root.querySelector('input[name=gender]:checked')?.value ?? c.gender;
    c.path = root.querySelector('input[name=path]:checked')?.value ?? c.path;
    c.style = root.querySelector('input[name=style]:checked')?.value ?? c.style;
    c.focus = [...root.querySelectorAll('input[name=focus]:checked')].map(i => i.value).slice(0, 2);
  }
  function makeCands() { create.seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0; create.candidates = E.makeCandidates({ seed: create.seed, style: create.style, gender: create.gender }); create.step = 'candidates'; render(); }
  function startCareer(i) {
    const c = create, cand = c.candidates[i];
    store.set(LAST_KEY, { name: c.name, gender: c.gender, nationality: c.nationality, path: c.path, style: c.style, focus: c.focus });
    S = E.newCareer({ name: c.name, gender: c.gender, nationality: c.nationality, path: c.path, style: c.style, focus: c.focus, candidate: cand, seed: (c.seed + 7) >>> 0, startYear: 2026 });
    tab = 'home'; save(); render();
  }
  function action(id) {
    switch (id) {
      case 'play': { const plan = root.querySelector('input[name=plan]:checked')?.value; act({ type: 'playSeason', plan }); window.scrollTo({ top: 0 }); break; }
      case 'continue': act({ type: 'continue' }); window.scrollTo({ top: 0 }); break;
      case 'decline-offers': act({ type: 'declineOffers' }); break;
      case 'advice-continue': act({ type: 'advice', retire: false }); break;
      case 'advice-retire': act({ type: 'advice', retire: true }); break;
      case 'ask-retire': ui.confirmRetire = true; render(); break;
      case 'cancel-retire': ui.confirmRetire = false; render(); break;
      case 'retire': ui.confirmRetire = false; act({ type: 'retire' }); break;
      case 'ask-new': ui.confirmNew = true; render(); break;
      case 'cancel-new': ui.confirmNew = false; render(); break;
      case 'new-career': { ui.confirmNew = false; S = null; store.del(SAVE_KEY); create.step = 'form'; create.candidates = null; tab = 'home'; render(); break; }
      case 'export': ui.exportOpen = !ui.exportOpen; render(); break;
      case 'copy-export': { const ta = $('#export-area'); if (!ta) break; const text = ta.value; (navigator.clipboard?.writeText(text) ?? Promise.reject()).then(() => { ui.importMsg = '복사했습니다.'; render(); }).catch(() => { ta.focus(); ta.select(); ui.importMsg = '자동 복사가 막혀 있어 텍스트를 선택했습니다. 직접 복사하세요.'; render(); }); break; }
      case 'import': { const ta = $('#import-area'); ui.importText = ta?.value ?? ''; try { const parsed = JSON.parse(ui.importText); if (!E.validState(parsed)) throw new Error('형식이 맞지 않습니다.'); S = parsed; ui.importMsg = '가져왔습니다.'; ui.importText = ''; tab = 'home'; save(); } catch (e) { ui.importMsg = `가져오기 실패: ${e.message}`; } render(); break; }
      case 'load-last': { const last = store.get(LAST_KEY); if (last) Object.assign(create, last); render(); break; }
      case 'recand': makeCands(); break;
      case 'back-form': create.step = 'form'; render(); break;
    }
  }
  render();
}

boot(E, document.getElementById('app'));
</script>
</body>
</html>
